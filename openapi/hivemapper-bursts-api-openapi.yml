openapi: 3.2.0
info:
  title: Hivemapper Bursts API
  x-refined-note:
  - x-generated differs across the merged source definitions and was not carried
  - x-method differs across the merged source definitions and was not carried
  - x-source differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged bursts across 2 of this provider''s published API definitions: hivemapper-openapi.json, hivemapper-beemaps-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://beemaps.com/api/developer
  description: Production
- url: https://hivemapper.com/api/developer
  description: Legacy Hivemapper Developer API host
tags:
- name: bursts
  description: On-demand mapping requests
paths:
  /burst/create:
    post:
      tags:
      - bursts
      summary: Create burst requests for on-demand mapping
      description: Request fresh imagery at specific locations. Network devices in the area are dispatched to capture it. Pay only on success.
      security:
      - ApiKeyQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BurstRequest'
            example:
            - geojson:
                type: Point
                coordinates:
                - -122.413
                - 37.786
                radius: 50
              credits: 125
      responses:
        '200':
          description: Created burst locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BurstLocation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: postBurstCreate
      x-operation-id-source: derived
    servers:
    - url: https://beemaps.com/api/developer
      description: Production
  /bursts:
    get:
      tags:
      - bursts
      summary: List burst requests
      description: List all burst requests and their statuses.
      responses:
        '200':
          description: Burst locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  bursts:
                    type: array
                    items:
                      $ref: '#/components/schemas/BurstLocation'
                  total:
                    type: integer
                  limit:
                    type: integer
                  skip:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - ApiKeyQuery: []
      operationId: getBursts
      x-operation-id-source: derived
    servers:
    - url: https://beemaps.com/api/developer
      description: Production
components:
  responses:
    RateLimited:
      description: 'Too Many Requests — rate limit exceeded (default: 100 req/min)'
    BadRequest:
      description: Bad Request — invalid geometry, missing required fields, or malformed JSON
    Forbidden:
      description: Forbidden — missing or invalid API key
    PaymentRequired:
      description: Payment Required — insufficient credits
    ServerError:
      description: Server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest_2:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    BurstLocation:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - active
          - expired
          - refunded
          - completed
        location:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
        geojson:
          $ref: '#/components/schemas/GeoJSONPolygon'
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        hit:
          type: boolean
        hitTimestamp:
          type:
          - string
          - 'null'
          format: date-time
        credits:
          type: integer
    BurstRequest:
      type: object
      required:
      - geojson
      properties:
        geojson:
          type: object
          description: GeoJSON Point with radius
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
            radius:
              type: number
              description: Radius in meters
        credits:
          type: integer
          description: Credits to allocate
    GeoJSONPolygon:
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          enum:
          - Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
            minItems: 4
    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
        statusCode:
          type: integer
    HoneyBurst:
      type: object
      properties:
        _id:
          type: string
        geojson:
          $ref: '#/components/schemas/GeoJSONGeometry'
        amount:
          type: number
        status:
          type: string
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        isHit:
          type: boolean
        latestHitAt:
          type: string
          format: date-time
    GeoJSONGeometry:
      type: object
      description: A GeoJSON geometry (Point, LineString, or Polygon) with [lon, lat] order.
      properties:
        type:
          type: string
          enum:
          - Point
          - LineString
          - Polygon
        coordinates: {}
        radius:
          type: number
          description: Radius in meters (for Point queries).
        buffer:
          type: number
          description: Buffer in meters (for LineString queries).
      required:
      - type
      - coordinates
    BurstCreate:
      type: object
      properties:
        geojson:
          $ref: '#/components/schemas/GeoJSONGeometry'
        trackedLocation:
          type: string
        expiration:
          type: string
        deviceType:
          type: string
          enum:
          - bee
      required:
      - geojson
    BurstListResult:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        skip:
          type: integer
        bursts:
          type: array
          items:
            $ref: '#/components/schemas/HoneyBurst'
    BurstCreateResult:
      type: object
      properties:
        success:
          type: boolean
        bursts:
          type: array
          items:
            $ref: '#/components/schemas/HoneyBurst'
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: 'API key passed as Basic auth header: `Authorization: Basic <API_KEY>`'
    ApiKeyQuery:
      type: apiKey
      in: query
      name: apiKey
      description: API key passed as query parameter (used for burst endpoints)
    basicAuth:
      type: http
      scheme: basic
      description: 'HTTP Basic authentication. Send Authorization: Basic <base64(username:api-key)>.'
    apiKeyQuery:
      type: apiKey
      in: query
      name: apiKey
      description: API key passed as the apiKey query parameter.
