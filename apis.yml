aid: hivemapper
name: Hivemapper
description: >-
  Hivemapper (Bee Maps) is a decentralized mapping network that turns a
  planetary-scale fleet of purpose-built "Bee" dashcams into fresh, structured,
  queryable street-level data. Contributors passively collect imagery while
  driving and earn HONEY tokens on Solana; the data is processed through
  on-device and cloud ML pipelines and delivered to developers as REST APIs.
  The Bee Maps Developer API offers a Street-Level Imagery API, a Map Features
  API (ML-detected signs, hydrants, lane lines and more), an AI Event Videos
  API (harsh braking, swerving, violations with synchronized sensor data), and
  Burst on-demand mapping, plus Edge AI for deploying custom ML workloads to
  cameras. Enterprise customers include HERE Technologies, Lyft, Mapbox, and
  Volkswagen. Billing is consumption-based (API credits plus per-view metering).
